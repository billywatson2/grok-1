<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Llama in your pocket</title>
<meta name="theme-color" content="#0f1115" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!--
  Self-contained: model, tokenizer and engine are all inline below.
  No server, no fetch, no network. Built by tools/build_phone_app.py.
-->
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ee; --dim: #9aa2b1; --accent: #7cc4ff; --accent-2: #8be9a8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px calc(30px + env(safe-area-inset-bottom)); }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 650; }
  .badges { display: flex; gap: 7px; flex-wrap: wrap; margin: 8px 0 14px; }
  .badge { font-size: 11.5px; color: var(--dim); background: var(--panel-2);
           border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .badge b { color: var(--accent-2); font-weight: 600; }
  p.sub { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 15px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px;
          text-transform: uppercase; letter-spacing: .6px; }
  label .val { color: var(--accent); text-transform: none; letter-spacing: 0;
               font-variant-numeric: tabular-nums; }
  textarea {
    width: 100%; min-height: 84px; resize: vertical; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px;
    font: inherit; font-size: 16px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  input[type=range] { width: 100%; height: 34px; accent-color: var(--accent); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button {
    background: var(--accent); color: #08131f; border: 0; border-radius: 9px;
    padding: 12px 18px; font: inherit; font-weight: 640; cursor: pointer;
    min-height: 48px; touch-action: manipulation; font-size: 15.5px;
  }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  .row > button { flex: 1 1 auto; }
  .out {
    white-space: pre-wrap; word-wrap: break-word; min-height: 190px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    padding: 12px 13px; font: 15px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
  }
  .out .prompt { color: var(--accent-2); }
  .cursor { color: var(--accent); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .stats { color: var(--dim); font-size: 12.5px; margin-top: 8px;
           font-variant-numeric: tabular-nums; }
  .boot { text-align: center; padding: 40px 10px; }
  .boot .bar { height: 4px; background: var(--panel-2); border-radius: 2px;
               overflow: hidden; margin: 16px auto 0; max-width: 320px; }
  .boot .bar i { display: block; height: 100%; width: 30%; background: var(--accent);
                 animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip { font-size: 12.5px; color: var(--dim); background: var(--panel-2);
          border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
          cursor: pointer; touch-action: manipulation; }
  .chip:active { border-color: var(--accent); color: var(--accent); }
  footer { color: var(--dim); font-size: 12px; text-align: center; margin-top: 18px; }
  @media (prefers-reduced-motion: reduce) { .cursor, .boot .bar i { animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <h1>Llama in your pocket</h1>
  <div class="badges" id="badges"></div>
  <p class="sub">
    A real Llama model running inside this browser tab. No server, no account, no
    network — it keeps working in airplane mode.
  </p>

  <div class="panel">
    <label for="prompt">Story beginning</label>
    <textarea id="prompt" autocapitalize="sentences">Once upon a time, a small robot who</textarea>
    <div class="chips" id="chips"></div>

    <div class="controls">
      <div>
        <label for="max">Tokens <span class="val" id="max-v">140</span></label>
        <input type="range" id="max" min="20" max="400" step="10" value="140" />
      </div>
      <div>
        <label for="temp">Temperature <span class="val" id="temp-v">0.80</span></label>
        <input type="range" id="temp" min="0" max="1.5" step="0.05" value="0.8" />
      </div>
    </div>

    <div class="row">
      <button id="go">Write a story</button>
      <button id="stop" class="ghost" disabled>Stop</button>
    </div>
  </div>

  <div class="panel">
    <label>Output</label>
    <div class="out" id="out"></div>
    <div class="stats" id="stats">idle</div>
  </div>

  <footer>
    stories15M · int8 · runs offline · <span id="foot-backend"></span>
  </footer>
</div>

<div class="wrap boot" id="boot">
  <h1>Llama in your pocket</h1>
  <p class="sub" id="boot-msg">Unpacking the model…</p>
  <div class="bar"><i></i></div>
</div>

<!-- model + tokenizer are inert text; base64 has no markup characters -->
<script id="llama-model" type="text/plain">__MODEL_B64__</script>
<script id="llama-tokenizer" type="text/plain">__TOKENIZER_B64__</script>
<script id="llama-stats" type="application/json">__STATS__</script>

<script>
/*__ENGINE__*/
</script>

<script>
(function () {
  "use strict";
  var stats = JSON.parse(document.getElementById("llama-stats").textContent);
  var model = null, tokenizer = null, state = null, busy = false, cancel = false;

  var $ = function (id) { return document.getElementById(id); };
  var PROMPTS = [
    "Once upon a time, a small robot who",
    "The little dragon could not fly, so",
    "One morning, a girl found a door in the garden",
    "There was a bear who loved to bake bread, and",
    "The old lighthouse keeper heard a knock",
  ];

  /* Warm the page first, then unpack the model on the next frame so the user
     sees the loading state instead of a frozen white screen. */
  setTimeout(function () {
    requestAnimationFrame(function () {
      try {
        $("boot-msg").textContent = "Unpacking weights (" + stats.mb + " MB)…";
        setTimeout(function () {
          var t0 = performance.now();
          var modelBytes = LlamaEngine.bytesFromBase64(
            $("llama-model").textContent.trim());
          model = new LlamaEngine.Llama(modelBytes.buffer);
          tokenizer = new LlamaEngine.Tokenizer(
            LlamaEngine.bytesFromBase64($("llama-tokenizer").textContent.trim()).buffer);
          var secs = ((performance.now() - t0) / 1000).toFixed(1);

          $("boot").hidden = true;
          $("app").hidden = false;
          $("badges").innerHTML =
            '<span class="badge">model: <b>stories15M</b></span>' +
            '<span class="badge">' + (stats.params / 1e6).toFixed(1) + 'M params</span>' +
            '<span class="badge">' + stats.layers + ' layers</span>' +
            '<span class="badge">int8</span>' +
            '<span class="badge">loaded in ' + secs + 's</span>';
          $("foot-backend").textContent = "loaded in " + secs + "s";
          $("chips").innerHTML = PROMPTS.map(function (p) {
            return '<span class="chip" data-p="' + p.replace(/"/g, "&quot;") + '">'
                 + p + "…</span>";
          }).join("");
          Array.prototype.forEach.call($("chips").children, function (chip) {
            chip.addEventListener("click", function () {
              $("prompt").value = chip.getAttribute("data-p");
            });
          });
          $("stats").textContent = "ready";
        }, 30);
      } catch (err) {
        $("boot-msg").innerHTML = "Could not load the model: " + err.message;
      }
    });
  }, 40);

  ["max", "temp"].forEach(function (id) {
    var sync = function () {
      $(id + "-v").textContent = id === "temp"
        ? Number($(id).value).toFixed(2) : $(id).value;
    };
    $(id).addEventListener("input", sync);
    sync();
  });

  function append(text) {
    var out = $("out");
    var cursor = out.querySelector(".cursor");
    if (cursor) cursor.remove();
    out.appendChild(document.createTextNode(text));
    out.insertAdjacentHTML("beforeend", '<span class="cursor">\u258c</span>');
  }

  /* The model is small enough to run on the main thread, but a single token is
     still tens of milliseconds of work. Yielding between tokens keeps the page
     responsive and lets text appear as it is produced. */
  function nextFrame() {
    return new Promise(function (resolve) { setTimeout(resolve, 0); });
  }

  async function generate() {
    if (busy || !model) return;
    busy = true; cancel = false;
    $("go").disabled = true; $("stop").disabled = false;

    var prompt = $("prompt").value;
    var maxTokens = Number($("max").value);
    var temperature = Number($("temp").value);

    $("out").innerHTML = "";
    var p = document.createElement("span");
    p.className = "prompt";
    p.textContent = prompt;
    $("out").appendChild(p);

    var ids = tokenizer.encode(prompt, true);
    var maxSeq = Math.min(768, ids.length + maxTokens + 8);
    state = model.newState(maxSeq);
    state.pos = 0;

    var logits = null;
    for (var i = 0; i < ids.length; i++) {
      logits = model.forward(ids[i], state);
      if (i % 8 === 0) await nextFrame();
    }

    var rng = new LlamaEngine.Rng((Date.now() & 0x7fffffff) || 7);
    var outIds = [];
    var emitted = "";
    var t0 = performance.now();

    for (var step = 0; step < maxTokens; step++) {
      var next = model.sample(logits, {
        temperature: temperature, topP: 0.9, topK: 40,
      }, rng);

      if (next === LlamaEngine.EOS_ID) break;
      outIds.push(next);

      var text = tokenizer.decode(outIds);
      if (text.length > emitted.length) {
        append(text.slice(emitted.length));
        emitted = text;
      }

      var secs = (performance.now() - t0) / 1000;
      $("stats").textContent = outIds.length + " tokens · " + secs.toFixed(1) + "s · "
        + (outIds.length / Math.max(secs, 0.001)).toFixed(1) + " tok/s";

      if (cancel) break;
      if (state.pos >= maxSeq - 1) break;

      logits = model.forward(next, state);
      await nextFrame();
    }

    var cursor = $("out").querySelector(".cursor");
    if (cursor) cursor.remove();
    var total = (performance.now() - t0) / 1000;
    $("stats").textContent += " · finished in " + total.toFixed(1) + "s";
    busy = false;
    $("go").disabled = false; $("stop").disabled = true;
  }

  $("go").addEventListener("click", generate);
  $("stop").addEventListener("click", function () { cancel = true; });
})();
</script>
</body>
</html>
